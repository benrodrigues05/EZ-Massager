name: Fetch brand assets

on:
  workflow_dispatch:
    inputs:
      extra_files:
        description: 'JSON array of {"url","out"} files to download verbatim under public/'
        required: false
        default: ''
      skip_images:
        description: 'Set to true to skip the image pipeline'
        required: false
        default: 'false'
  push:
    branches: [claude/ez-massager-redesign-ppgdmn]

permissions:
  contents: write

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fetch-assets]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-assets.mjs
        env:
          EXTRA_FILES: ${{ github.event.inputs.extra_files }}
          SKIP_IMAGES: ${{ github.event.inputs.skip_images }}
      - name: Commit optimised assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          git commit -m "chore: add optimised brand assets fetched from ezmassager.co.za" || echo "nothing to commit"
          git push
